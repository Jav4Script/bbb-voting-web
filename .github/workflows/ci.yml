name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - chore/react-19-migration-clean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Persist regenerated lockfile
        if: github.event_name == 'push' && github.ref_name == 'chore/react-19-migration-clean'
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: regenerate pnpm lockfile for React 19"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test -- --run
