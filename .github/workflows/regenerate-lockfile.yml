name: Regenerate lockfile

on:
  push:
    branches:
      - chore/tanstack-query-v5-migration

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/tanstack-query-v5-migration
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Resolve TanStack Query
        run: pnpm add @tanstack/react-query@5.102.8 --save-exact --lockfile-only

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml package.json
          git commit -m "chore: regenerate pnpm lockfile"
          git push origin HEAD:chore/tanstack-query-v5-migration
