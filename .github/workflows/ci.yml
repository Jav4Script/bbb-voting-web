name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint src

      - name: Check changed-code and manifest formatting
        run: pnpm dlx prettier@3.9.10 --check package.json eslint.config.js src/features/votes/stores/useVoteStore.ts src/hooks/use-toast.ts src/shared/components/ui/input.tsx src/shared/components/ui/textarea.tsx

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test -- --run
